name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate-packages:
    name: Validate package composer files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: composer validate per package
        run: |
          set -e
          for pkg in packages/*/composer.json; do
            echo "== $pkg =="
            composer validate --strict --no-check-publish "$pkg"
          done

  test:
    name: PHP ${{ matrix.php }} — tests + lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPCS (PSR-12)
        run: composer cs-check

      - name: PHPStan
        run: composer analyse

      - name: PHPUnit
        run: composer test

      - name: Theme validator (home-living)
        run: php tools/theme-validator.php packages/theme-home-living
